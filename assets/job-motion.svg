<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" font-family="system-ui,Arial,sans-serif"><title>Job lifecycle with two retries</title><style>@media(prefers-reduced-motion:reduce){.moving{animation:none!important}}</style><rect width="920" height="220" fill="#101013" rx="16"/><style>@keyframes travel{0%,8%{transform:translate(84px,122px)}22%{transform:translate(310px,122px)}36%{transform:translate(560px,122px)}43%{transform:translate(560px,170px)}49%{transform:translate(310px,170px)}53%{transform:translate(310px,122px)}60%{transform:translate(560px,122px)}65%{transform:translate(560px,170px)}72%{transform:translate(310px,170px)}76%{transform:translate(310px,122px)}84%{transform:translate(560px,122px)}94%,100%{transform:translate(827px,122px)}}</style><text x="28" y="41" fill="#f3f3f5" font-size="29">Follow a background job</text><text x="29" y="70" fill="#bcbcc5" font-size="16">Two transient failures send the job back to the queue before it completes.</text><path d="M84 122H827 M560 122v48H310v-48" fill="none" stroke="#9d8d70" stroke-width="2"/><circle cx="84" cy="122" r="10" fill="#17171b" stroke="#bfc0c9"/><text x="58" y="103" fill="#f3f3f5" font-size="16">Submit</text><circle cx="310" cy="122" r="10" fill="#17171b" stroke="#bfc0c9"/><text x="284" y="103" fill="#f3f3f5" font-size="16">Queue</text><circle cx="560" cy="122" r="10" fill="#17171b" stroke="#bfc0c9"/><text x="534" y="103" fill="#f3f3f5" font-size="16">Worker</text><circle cx="827" cy="122" r="10" fill="#17171b" stroke="#bfc0c9"/><text x="801" y="103" fill="#f3f3f5" font-size="16">Result</text><text x="395" y="199" fill="#e5c98c" font-size="15">Retry loop</text><g class="moving" style="transform:translate(84px,122px);animation:travel 10s linear infinite"><circle r="13" fill="#e5c98c" opacity=".23"/><circle r="6" fill="#ffdfa1"/></g></svg>