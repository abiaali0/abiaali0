services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      FLAGFORGE_DB: /data/flagforge.db
    volumes:
      - flagforge_data:/data
  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  flagforge_data:
